<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       * {
            margin: 0px;
            padding: 0px;
        }
        .header{
            background-color: blue;
            
        }
        .header ul{
            margin: 0px;
            padding: 0px;
            list-style: none;
            text-align: center;
        }
        .header li{
            display: inline-block;
            position: relative;
        }
        .header a{
            display: block;
            padding: 12px 15px;
            text-decoration: none;
            color: white;
        
            
        }
        .header a:hover{
            background-color: tomato;
        }
        .header ul ul{
            position: absolute;
            left: 0px;
            top: 40px;
            background-color: aqua;
            display: none;
        }
        .header ul ul li{
            display:block;
        }
        .header ul  :hover ul{
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <ul>
            <li> <a href="">Home</a></li>
            <li> <a href="">About</a></li>
            <li> <a href="">Product</a>
            <ul>
                <li><a href="">shirt</a></li>
                <li><a href="">pant</a></li>
                <li><a href="">Underwear</a></li>
                <li><a href="">T-shirt</a></li>
            </ul>
            </li>
            <li> <a href="">Men</a></li>
            <li> <a href="">Women</a></li>
        </ul>
    </div>
</body>
</html>
